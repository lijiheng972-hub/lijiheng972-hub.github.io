<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photos · Jiheng Li</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Caveat:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<style>
  .page { max-width: 1280px; }

  .head-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 520px); gap: 48px; align-items: center; margin-bottom: 64px; }
  .head-row .page-head { margin-bottom: 0; }
  .me-shooting {
    margin: 0; background: #fff; padding: 10px 10px 40px; position: relative;
    box-shadow: 0 18px 40px -20px rgba(58,47,34,.55);
    transform: rotate(1.8deg);
  }
  .me-shooting img { width: 100%; height: auto; display: block; }
  .me-shooting figcaption { position: absolute; left: 0; right: 0; bottom: 8px; text-align: center; font-family: 'Caveat', cursive; font-size: 1.35rem; color: var(--ink-2); }
  .me-shooting::before, .me-shooting::after {
    content: ''; position: absolute; top: -10px; width: 78px; height: 22px; background: rgba(220,164,68,.5);
  }
  .me-shooting::before { left: -18px; transform: rotate(-32deg); top: 4px; }
  .me-shooting::after { right: -18px; transform: rotate(32deg); top: 4px; }

  .wall { columns: 3 300px; column-gap: 22px; }
  .print {
    break-inside: avoid;
    margin: 0 0 22px;
    background: #fff;
    padding: 8px 8px 8px;
    box-shadow: 0 1px 0 rgba(0,0,0,.03), 0 12px 28px -18px rgba(58,47,34,.5);
    cursor: zoom-in;
    transition: transform .3s cubic-bezier(.34,1.56,.64,1), box-shadow .3s;
    display: block; width: 100%; border: 0; text-align: left;
  }
  .print:hover, .print:focus-visible {
    transform: translateY(-4px) rotate(var(--r, 0deg));
    box-shadow: 0 1px 0 rgba(0,0,0,.03), 0 22px 40px -20px rgba(58,47,34,.6);
    outline: none;
  }
  .print:focus-visible { box-shadow: 0 0 0 2px var(--ink); }
  .print img { width: 100%; height: auto; display: block; background: #e6dfd2; }
  .print .no { display: block; font-family: var(--mono); font-size: .66rem; color: var(--muted); margin-top: 6px; letter-spacing: .6px; }

  /* lightbox */
  .lb {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(22, 20, 17, .95);
    display: none; align-items: center; justify-content: center;
  }
  .lb.open { display: flex; }
  .lb img {
    max-width: calc(100vw - 160px); max-height: calc(100vh - 110px);
    object-fit: contain; box-shadow: 0 30px 60px rgba(0,0,0,.5);
    background: #2a2622;
  }
  .lb button {
    position: absolute; background: none; border: 0; color: #e9e3d8; cursor: pointer;
    font-family: var(--mono); font-size: .8rem; letter-spacing: 1px;
    padding: 14px 18px;
  }
  .lb button:hover { color: #fff; }
  .lb .prev, .lb .next { top: 50%; transform: translateY(-50%); font-size: 1.6rem; }
  .lb .prev { left: 12px; }
  .lb .next { right: 12px; }
  .lb .close { top: 12px; right: 12px; }
  .lb .count { position: absolute; bottom: 22px; left: 0; right: 0; text-align: center; font-family: var(--mono); font-size: .74rem; color: #a59d90; letter-spacing: 1px; }

  @media (max-width: 860px) {
    .head-row { grid-template-columns: 1fr; gap: 32px; margin-bottom: 40px; }
    .me-shooting { transform: rotate(1deg); }
    .me-shooting::before { left: -4px; }
    .me-shooting::after { right: -4px; }
  }
  @media (max-width: 700px) {
    .wall { columns: 2; column-gap: 10px; }
    .print { margin-bottom: 10px; padding: 4px; }
    .print .no { display: none; }
    .lb img { max-width: 100vw; max-height: calc(100vh - 120px); }
    .lb .prev, .lb .next { top: auto; bottom: 6px; transform: none; }
  }
</style>
</head>
<body>
<div class="page">
  <header class="topbar">
    <a class="back" href="index.html">← Back to the console</a>
    <nav>
      <a href="research.html">Research</a>
      <a href="photos.html" aria-current="page">Photos</a>
      <a href="about.html">About</a>
      <a href="cv.pdf">CV</a>
    </nav>
  </header>

  <div class="head-row">
    <div class="page-head">
      <div class="kicker">Cartridge 02 · Photos</div>
      <h1>Off the <em>clock</em></h1>
      <p>Portraits from shoots that stayed with me: a red costume against snow mountains, a vintage room with an upright piano, a stairwell lit by one window. Click any print to see it larger; arrow keys flip through.</p>
    </div>
    <figure class="me-shooting">
      <img src="assets/life-shooting.jpg" alt="Jiheng shooting with a camera, leaning on a lamp post by the water" width="1320" height="735">
      <figcaption>usually I'm on this side of the camera</figcaption>
    </figure>
  </div>

  <div class="wall" id="wall"></div>
</div>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Photo viewer">
  <img id="lb-img" alt="">
  <button class="close" id="lb-close" aria-label="Close">CLOSE ✕</button>
  <button class="prev" id="lb-prev" aria-label="Previous photo">←</button>
  <button class="next" id="lb-next" aria-label="Next photo">→</button>
  <div class="count" id="lb-count"></div>
</div>

<script>
(() => {
  // [file, width, height] of the full-size versions in assets/photos/
  const PHOTOS = [["p01.jpg",1440,810],["p02.jpg",1600,1066],["p03.jpg",1440,960],["p04.jpg",1440,810],["p05.jpg",1067,1600],["p06.jpg",1067,1600],["p07.jpg",1440,810],["p08.jpg",1600,1067],["p09.jpg",1600,1067],["p10.jpg",1067,1600],["p11.jpg",1067,1600],["p12.jpg",1600,1067],["p13.jpg",1600,1067],["p14.jpg",1067,1600],["p15.jpg",1067,1600],["p16.jpg",1600,1067],["p17.jpg",1600,1067],["p18.jpg",1600,1067],["p19.jpg",1067,1600],["p20.jpg",1600,1067],["p21.jpg",1600,1067],["p22.jpg",1067,1600],["p23.jpg",1600,900],["p24.jpg",1200,1600],["p25.jpg",767,1600],["p26.jpg",1200,1600],["p27.jpg",1200,1600],["p28.jpg",1200,1600],["p29.jpg",1200,1600],["p30.jpg",1200,1600],["p31.jpg",1067,1600],["p32.jpg",1067,1600],["p33.jpg",1067,1600],["p34.jpg",1067,1600],["p35.jpg",1600,1067],["p36.jpg",1067,1600],["p37.jpg",1067,1600],["p38.jpg",1067,1600],["p39.jpg",1600,1067],["p40.jpg",893,1600],["p41.jpg",1200,1600],["p42.jpg",1200,1600],["p43.jpg",1200,1600],["p44.jpg",1199,1600],["p45.jpg",1067,1600],["p46.jpg",1071,1600],["p47.jpg",1600,1066],["p48.jpg",1600,1067],["p49.jpg",1067,1600],["p50.jpg",1440,960]];

  const wall = document.getElementById('wall');
  const tilts = [-1.2, .8, -.5, 1.1, -.9, .4];
  PHOTOS.forEach(([f, w, h], i) => {
    const b = document.createElement('button');
    b.className = 'print';
    b.style.setProperty('--r', tilts[i % tilts.length] + 'deg');
    b.setAttribute('aria-label', `Open photo ${i + 1} of ${PHOTOS.length}`);
    b.innerHTML = `<img src="assets/photos/thumb/${f}" width="${w}" height="${h}" loading="lazy" decoding="async" alt="Portrait ${i + 1}"><span class="no">No. ${String(i + 1).padStart(2, '0')}</span>`;
    b.addEventListener('click', () => open(i));
    wall.appendChild(b);
  });

  const lb = document.getElementById('lb'), img = document.getElementById('lb-img'), count = document.getElementById('lb-count');
  let cur = 0, opener = null;

  function show(i) {
    cur = (i + PHOTOS.length) % PHOTOS.length;
    img.src = 'assets/photos/' + PHOTOS[cur][0];
    img.alt = `Portrait ${cur + 1}`;
    count.textContent = `${String(cur + 1).padStart(2, '0')} / ${PHOTOS.length}`;
    [cur + 1, cur - 1].forEach(j => { const p = PHOTOS[(j + PHOTOS.length) % PHOTOS.length]; new Image().src = 'assets/photos/' + p[0]; });
  }
  function open(i) {
    opener = document.activeElement;
    show(i); lb.classList.add('open'); document.body.style.overflow = 'hidden';
    document.getElementById('lb-close').focus();
  }
  function close() {
    lb.classList.remove('open'); document.body.style.overflow = '';
    if (opener) opener.focus();
  }

  document.getElementById('lb-prev').onclick = () => show(cur - 1);
  document.getElementById('lb-next').onclick = () => show(cur + 1);
  document.getElementById('lb-close').onclick = close;
  lb.addEventListener('click', e => { if (e.target === lb) close(); });
  addEventListener('keydown', e => {
    if (!lb.classList.contains('open')) return;
    if (e.key === 'Escape') close();
    else if (e.key === 'ArrowRight') show(cur + 1);
    else if (e.key === 'ArrowLeft') show(cur - 1);
  });

  let x0 = null;
  lb.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; }, { passive: true });
  lb.addEventListener('touchend', e => {
    if (x0 === null) return;
    const dx = e.changedTouches[0].clientX - x0;
    if (Math.abs(dx) > 40) show(cur + (dx < 0 ? 1 : -1));
    x0 = null;
  });
})();
</script>
</body>
</html>
